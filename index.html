P[3]='<div class="paper"></div><div class="in"><div class="frame"></div>'+sp('left:12%;top:10%')+sp('right:12%;top:30%;width:4cqw;height:4cqw;animation-delay:-1s')+sp('right:18%;bottom:14%;animation-delay:-2s')+
 stamp('h','left:9%;top:7%;width:13cqw;transform:rotate(-5deg)')+post('right:8%;top:7%;transform:rotate(10deg)')+owl('left:9%;bottom:8%')+tape('right:-3%;bottom:6%;transform:rotate(-36deg)')+
 '<div class="txt" style="inset:20% 12% 12% 12%;--wd:6s"><div class="h">P.S.</div><p>Thank you for being my safe place. Whatever this year brings, I will be right here beside you, just like you have always been beside me.</p><p style="margin-top:3cqw">Happy Birthday, '+HER+'.</p><div class="sign">'+ME+'</div><div style="text-align:center;margin-top:3cqw">'+seal()+'</div><p class="small" style="text-align:center;margin-top:2cqw">Mischief managed.</p></div></div>';

var idx=0,busy=false,mq=matchMedia('(min-width:820px)');
function step(){return mq.matches?2:1}
function pg(i,c){return '<div class="page '+c+'">'+P[i]+'</div>'}
function ui(){var s=step(),n=P.length/s,d='';for(var j=0;j<n;j++)d+='<span class="dot'+(j===idx/s?' on':'')+'"></span>';$('dots').innerHTML=d;$('prev').disabled=idx===0;$('next').disabled=idx+s>=P.length}
function render(){var s=step(),h='';idx=Math.floor(idx/s)*s;for(var i=idx;i<idx+s&&i<P.length;i++)h+=pg(i,s===2?(i%2?'right':'left'):'');$('book').innerHTML=h;ui()}
function go(dir){
  if(busy)return;var s=step(),n=idx+dir*s;if(n<0||n>=P.length)return;
  var b=$('book'),h,lf,pos,org,kf;
  if(s===2){
    if(dir>0){h=pg(idx,'left')+pg(n+1,'right');lf='<div class="face">'+pg(idx+1,'right')+'</div><div class="face back">'+pg(n,'left')+'</div>';org='left';pos='left:var(--pw)';kf=[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}]}
    else{h=pg(n,'left')+pg(idx+1,'right');lf='<div class="face">'+pg(idx,'left')+'</div><div class="face back">'+pg(n+1,'right')+'</div>';org='right';pos='left:0';kf=[{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}]}
  }else{
    h=pg(dir>0?n:idx,'');lf='<div class="face">'+pg(dir>0?idx:n,'')+'</div>';org='left';pos='left:0';
    kf=dir>0?[{transform:'rotateY(0deg)',opacity:1},{transform:'rotateY(-100deg)',opacity:0}]:[{transform:'rotateY(-100deg)',opacity:0},{transform:'rotateY(0deg)',opacity:1}];
  }
  busy=true;b.classList.add('fl');
  b.innerHTML=h+'<div class="leaf" style="'+pos+';transform-origin:'+org+' center">'+lf+'</div>';
  var done=function(){idx=n;b.classList.remove('fl');busy=false;render()};
  var L=b.querySelector('.leaf');
  if(L.animate)L.animate(kf,{duration:still?1:1150,easing:'ease-in-out',fill:'forwards'}).onfinish=done;else done();
}
$('prev').onclick=function(){go(-1)};$('next').onclick=function(){go(1)};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
var tx=null;addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);tx=null});
mq.addEventListener('change',function(){if(!busy)render()});

/* floating candles + golden dust (lightweight) */
var bg=$('bgc'),bx=bg.getContext('2d'),BW,BH,candles=[],dust=[],running=false,last=0,glow=document.createElement('canvas');
glow.width=glow.height=64;(function(){var g=glow.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,214,140,1)');r.addColorStop(.25,'rgba(255,170,70,.55)');r.addColorStop(1,'rgba(255,140,40,0)');g.fillStyle=r;g.fillRect(0,0,64,64)})();
function sprite(w,h){var c=document.createElement('canvas');c.width=Math.ceil(w+2);c.height=Math.ceil(h+w);var g=c.getContext('2d'),lg=g.createLinearGradient(0,0,w,0);lg.addColorStop(0,'#7d6c54');lg.addColorStop(.5,'#f3e3c0');lg.addColorStop(1,'#b09770');g.fillStyle=lg;g.fillRect(1,w*.2,w,h);g.fillStyle='#f6e9c8';g.beginPath();g.ellipse(1+w/2,w*.2,w/2,w*.18,0,0,6.28);g.fill();return c}
function bsize(){BW=bg.width=innerWidth;BH=bg.height=innerHeight;candles=[];dust=[];var n=BW>820?36:18,i,z,s,w,h;
  for(i=0;i<n;i++){z=Math.random();s=.4+z*.9;w=7*s;h=(30+z*30)*s;candles.push({x:Math.random()*BW,y:Math.random()*BH*.8+10,s:s,w:w,a:.5+z*.5,ph:Math.random()*6.28,sp:.3+Math.random()*.5,fp:Math.random()*6.28,sprite:sprite(w,h),z:z})}
  candles.sort(function(a,b){return a.z-b.z});
  for(i=0;i<(BW>820?60:36);i++)dust.push({x:Math.random()*BW,y:Math.random()*BH,r:Math.random()*1.4+.5,v:.12+Math.random()*.4,ph:Math.random()*6.28})}
function bloop(ts){
  if(document.hidden||ts-last<33){requestAnimationFrame(bloop);return}last=ts;
  var t=still?0:ts/1000;bx.clearRect(0,0,BW,BH);
  candles.forEach(function(c){var s=c.s,cy=c.y+Math.sin(t*c.sp+c.ph)*7*s,x=c.x+Math.sin(t*c.sp*.6+c.ph)*5,fl=1+Math.sin(t*9+c.fp)*.08+Math.sin(t*23+c.fp*2)*.05,fh=16*s*fl;
    bx.globalCompositeOperation='source-over';bx.globalAlpha=c.a;bx.drawImage(c.sprite,x-1-c.w/2,cy-c.w*.2);
    bx.globalCompositeOperation='lighter';var sz=95*s*fl;bx.globalAlpha=.5*c.a;bx.drawImage(glow,x-sz/2,cy-fh*.6-sz/2,sz,sz);
    bx.globalAlpha=1;bx.fillStyle='#ffd27a';bx.beginPath();bx.ellipse(x,cy-fh*.5,2.4*s,fh*.55,0,0,6.28);bx.fill()});
  bx.fillStyle='#ffd98a';
  dust.forEach(function(d){if(!still){d.y-=d.v;if(d.y<-5){d.y=BH+5;d.x=Math.random()*BW}}bx.globalAlpha=.25+.7*Math.abs(Math.sin(t*1.5+d.ph));bx.beginPath();bx.arc(d.x,d.y,d.r,0,6.28);bx.fill()});
  requestAnimationFrame(bloop)}
function startBg(){if(running)return;running=true;bsize();bg.classList.add('on');requestAnimationFrame(bloop)}
addEventListener('resize',function(){if(running)bsize()});

$('closed').onclick=function(){
  var c=$('closed');c.style.animation='none';c.classList.add('untie');
  setTimeout(function(){$('closedWrap').classList.add('gone');startBg()},900);
  setTimeout(function(){$('closedWrap').style.display='none';var b=$('bookWrap');b.style.display='flex';render();requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('show')})})},1800);
};
</script>
